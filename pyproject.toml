[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papersearch"
version = "0.1.0"
description = "Local paper screening pipeline"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.18.4",
    "SQLAlchemy==2.0.49",
    "mysql-connector-python==9.6.0",
    "kafka-python==2.3.2",
    "pyarrow==23.0.1",
]

[project.optional-dependencies]
review = ["fastapi==0.165.0", "uvicorn==0.54.0", "streamlit==1.67.0", "requests==2.34.2", "numpy==2.5.5", "onnxruntime==1.32.0", "tokenizers==0.23.3"]
test = ["pytest==9.1.1"]

[project.scripts]
papersearch = "papersearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
